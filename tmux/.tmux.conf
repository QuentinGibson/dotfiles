# Options to make tmux more pleasant
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g prefix C-a
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

# Configure the catppuccin plugin
set -g @catppuccin_flavor "macchiato" # latte, frappe, macchiato, or mocha
set -g @catppuccin_window_status_style "rounded" # basic, rounded, slanted, custom, or none

# Make the status line pretty and add some modules
set -g status-right-length 200
set -g status-left-length 100
set -g status-left ""
set -g status-right "#(~/.local/bin/claude-usage short) "
set -agF status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

set -g @resurrect-strategy-vim 'session'
# Disable auto-restore on boot (use Ctrl+a Ctrl+r to manually restore)
# set -g @continuum-restore 'on'

set-window-option -g mode-keys vi

# Disable automatic window renaming to keep custom names
set-option -g allow-rename off
set-window-option -g automatic-rename off

# Claude usage: Ctrl+a U toggles percent/cost, Ctrl+a B opens dashboard
bind U run-shell "~/.local/bin/claude-usage toggle && tmux refresh-client -S"
bind B display-popup -E -w 82 -h 90% "~/.local/bin/claude-usage dashboard"

# Custom keybinding to show workflow cheat sheet (Ctrl+a + ?)
bind-key ? display-popup -E -w 80% -h 80%  "cat << 'EOF'


╔══════════════════════════════════════════════════════════════════════════╗
║                      TMUX MULTI-PROJECT WORKFLOW                         ║
╔══════════════════════════════════════════════════════════════════════════╗

SESSION MANAGEMENT (One project per session)
────────────────────────────────────────────────────────────────────────────
  Ctrl+a s          List all sessions (arrow keys to switch)
  Ctrl+a (          Switch to previous session
  Ctrl+a )          Switch to next session
  Ctrl+a d          Detach from current session

  Ctrl+a g          Prompt for session name and switch (sessionist)
  Ctrl+a C          Create new session (sessionist)
  Ctrl+a X          Kill current session without detaching (sessionist)

PANE MANAGEMENT (Moving panes between windows)
────────────────────────────────────────────────────────────────────────────
  Ctrl+a !          Break pane out to a new window
  Ctrl+a :join-pane -s 2.1   Move pane 1 from window 2 to current window
  Ctrl+a :join-pane -t 3     Move current pane to window 3
  Ctrl+a @          Promote current pane to a new session (sessionist)

LAYOUT MANAGEMENT (Save and reuse pane layouts)
────────────────────────────────────────────────────────────────────────────
  Ctrl+a Space      Cycle through preset layouts
  Ctrl+a :select-layout even-horizontal   Apply even horizontal layout
  Ctrl+a :select-layout even-vertical     Apply even vertical layout
  Ctrl+a :select-layout main-horizontal   Apply main-horizontal layout
  Ctrl+a :select-layout tiled             Apply tiled layout

SESSION PERSISTENCE (Auto-save every 15 minutes)
────────────────────────────────────────────────────────────────────────────
  Ctrl+a Ctrl+s     Save all sessions manually
  Ctrl+a Ctrl+r     Restore all sessions (after reboot)

Press ENTER or ESC to close
EOF
read"
set -g @plugin 'long-910/tmux-claude-status'
set -g @claude-tmux-auto-status  "false"
set -g @claude-tmux-install-hook "true"

set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-continuum'

run '~/.tmux/plugins/tpm/tpm'

# Popup styling — override catppuccin defaults with purple (mauve)
set -g popup-style        "bg=#24273a,fg=#cad3f5"
set -g popup-border-style "fg=#c6a0f6"
set -g popup-border-lines "rounded"

